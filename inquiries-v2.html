<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle — Inquiries</title>
<link rel="icon" type="image/png" href="https://junglecreations.com/favicon-32x32.png?v=1b5e54ab68eeaed11a7dbfe7d0035e99">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F5F0E8; --cream-soft: #EFE9DF; --black: #0E0E0E; --green: #87FB66;
  --grey: #C8C3B8; --grey-mid: #8A8880; --grey-light: #E8E3DA; --white: #FFFFFF;
  --header-h: 56px; --coral: #FF6B4A; --amber: #F0B429; --teal: #3ECF8E; --next: #4ABFFF;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{background:var(--cream);color:var(--black);font-family:'DM Sans',system-ui,sans-serif;height:100%;-webkit-font-smoothing:antialiased;}
#topbar{position:fixed;top:0;right:0;left:52px;z-index:100;height:var(--header-h);background:var(--black);display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid rgba(255,255,255,0.07);}
.topbar-title{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.35);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.tbtn{display:flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;padding:6px 14px;border-radius:100px;cursor:pointer;transition:all 0.15s;white-space:nowrap;border:1px solid rgba(255,255,255,0.15);background:transparent;color:rgba(255,255,255,0.55);}
.tbtn:hover{border-color:rgba(255,255,255,0.35);color:rgba(255,255,255,0.9);}
.tbtn svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.8;}
.tbtn.spinning svg{animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#main{position:fixed;top:var(--header-h);left:52px;right:0;bottom:0;overflow-y:auto;}
#gate-overlay{position:fixed;inset:0;z-index:999;background:var(--black);display:flex;align-items:center;justify-content:center;}
.gate-box{text-align:center;}
.gate-wm{font-size:28px;font-weight:800;letter-spacing:-0.04em;color:var(--white);margin-bottom:28px;display:block;}
.gate-wm span{color:var(--green);}
.gate-input{display:block;width:240px;padding:12px 18px;margin:0 auto 12px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:10px;color:var(--white);font-size:15px;text-align:center;font-family:'DM Mono',monospace;letter-spacing:0.15em;outline:none;}
.gate-input:focus{border-color:var(--green);}
.gate-btn{width:240px;padding:11px;background:var(--green);color:var(--black);border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:0.1em;text-transform:uppercase;}
.gate-error{color:var(--coral);font-size:12px;margin-top:10px;font-family:'DM Mono',monospace;min-height:18px;}
</style>
</head>
<body>
<div id="gate-overlay">
  <div class="gate-box">
    <span class="gate-wm">jungle<span>.</span></span>
    <input id="gate-input" class="gate-input" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkGate()">
    <button class="gate-btn" onclick="checkGate()">Enter</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>
<div id="topbar">
  <span class="topbar-title">Inquiries</span>
  <div class="topbar-right"><button class="tbtn" id="refresh-btn" onclick="loadInquiries()"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c-1.66 0-3-4.03-3-9s1.34-9 3-9m0 18c1.66 0 3-4.03 3-9s-1.34-9-3-9m-9 9a9 9 0 019-9"/></svg>Refresh</button></div>
</div>
<div id="main">
<style>
#inq-layout{{display:grid;grid-template-columns:260px 1fr 300px;height:calc(100vh - var(--header-h));overflow:hidden;}}
.inq-col{{display:flex;flex-direction:column;border-right:1.5px solid var(--grey-light);overflow:hidden;}}
.inq-col:last-child{{border-right:none;}}
.inq-col-header{{flex-shrink:0;padding:14px 16px;font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--grey-mid);border-bottom:1.5px solid var(--grey-light);display:flex;align-items:center;justify-content:space-between;}}
.inq-col-body{{flex:1;overflow-y:auto;}}
.inquiry-row{{padding:12px 16px;border-bottom:1px solid var(--grey-light);cursor:pointer;transition:background 0.1s;animation:fadeIn 0.2s ease both;}}
.inquiry-row:hover{{background:var(--cream-soft);}}
.inquiry-row.active{{background:var(--cream);border-left:3px solid var(--black);}}
@keyframes fadeIn{{from{{opacity:0;}}to{{opacity:1;}}}}
.inquiry-name{{font-size:13px;font-weight:600;letter-spacing:-0.01em;}}
.inquiry-company{{font-size:11px;color:var(--grey-mid);margin-top:2px;}}
.inquiry-meta{{display:flex;align-items:center;gap:6px;margin-top:6px;}}
.inquiry-date{{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--grey-mid);}}
.inq-message-empty,.inq-status-empty{{padding:24px 16px;font-size:12px;color:var(--grey-mid);font-style:italic;}}
.inq-message-company{{font-size:15px;font-weight:700;letter-spacing:-0.02em;margin-bottom:2px;}}
.inq-message-contact{{font-size:12px;color:var(--grey-mid);margin-bottom:12px;}}
.inq-message-body{{font-size:13px;line-height:1.65;color:var(--black);white-space:pre-wrap;}}
.inq-message-email{{font-family:'DM Mono',monospace;font-size:10px;color:var(--grey-mid);margin-top:12px;}}
.inq-status-select{{width:100%;padding:9px 11px;border:1.5px solid var(--grey-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;background:var(--white);color:var(--black);outline:none;cursor:pointer;margin-bottom:14px;}}
.inq-status-select:focus{{border-color:var(--black);}}
.inq-notes-textarea{{width:100%;padding:10px 12px;border:1.5px solid var(--grey-light);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--black);resize:vertical;outline:none;min-height:100px;margin-bottom:8px;box-sizing:border-box;}}
.inq-notes-textarea:focus{{border-color:var(--black);}}
.inq-save-note-btn{{width:100%;padding:10px;background:var(--black);color:var(--green);border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:opacity 0.15s;}}
.inq-save-note-btn:hover{{opacity:0.85;}}
.inq-save-note-btn:disabled{{opacity:0.4;cursor:default;}}
.inq-save-status{{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;margin-top:6px;min-height:16px;}}
.inq-save-status.saving{{color:var(--amber);}}
.inq-save-status.saved{{color:var(--teal);}}
.inq-save-status.error{{color:var(--coral);}}
.inq-label{{font-family:'DM Mono',monospace;font-size:9px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--grey-mid);margin-bottom:7px;}}
.empty-state{{padding:40px 16px;color:var(--grey-mid);font-size:13px;line-height:1.6;}}
</style>
<div id="inq-layout">
  <div class="inq-col">
    <div class="inq-col-header">Inquiries <span id="inq-count" style="font-weight:400">—</span></div>
    <div class="inq-col-body" id="inquiries-list"><div class="empty-state">Loading…</div></div>
  </div>
  <div class="inq-col">
    <div class="inq-col-header">Message</div>
    <div class="inq-col-body" style="padding:16px 20px" id="inquiries-message-body">
      <div class="inq-message-empty">Select an inquiry to read the message</div>
    </div>
  </div>
  <div class="inq-col">
    <div class="inq-col-header">Status &amp; Notes</div>
    <div class="inq-col-body" style="padding:16px;display:flex;flex-direction:column;" id="inquiries-status-body">
      <div class="inq-status-empty">Select an inquiry to update status and add notes</div>
    </div>
  </div>
</div>
</div>
<script src="https://jungle-is-massive.github.io/hub/config.js"></script>
<script src="https://jungle-is-massive.github.io/hub/hub-overlay.js" defer></script>
<script>
const GATE_PASSWORD = 'massive';
function checkGate() {
  const v = document.getElementById('gate-input').value.trim();
  if (v === GATE_PASSWORD) { sessionStorage.setItem('jc_auth','1'); document.getElementById('gate-overlay').remove(); init(); }
  else { document.getElementById('gate-error').textContent = 'Wrong password.'; document.getElementById('gate-input').value = ''; }
}
if (sessionStorage.getItem('jc_auth') === '1') document.getElementById('gate-overlay').remove();
const SUPABASE_URL = (window.JUNGLE_CONFIG||{}).SB_URL || '';
const SUPABASE_KEY = (window.JUNGLE_CONFIG||{}).SB_KEY || '';
const HS_PROXY = `${SUPABASE_URL}/functions/v1/hs-proxy`;
const GCAL_CLIENT_ID = '161148155885-jmk24mva9i9akjknkes29kso7n1c9bgl.apps.googleusercontent.com';
let gcalAccessToken = localStorage.getItem('gcal_access_token') || '';
let gcalTokenExpiry = parseInt(localStorage.getItem('gcal_token_expiry') || '0');
function gcalIsConnected() { return gcalAccessToken && Date.now() < gcalTokenExpiry; }
function gcalSignIn() {
  const redirect = encodeURIComponent(window.location.href.split('?')[0].split('#')[0]);
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GCAL_CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=${encodeURIComponent('https://www.googleapis.com/auth/calendar.events.readonly')}&prompt=select_account`;
  window.location.href = url;
}
function gcalSignOut() {
  gcalAccessToken=''; gcalTokenExpiry=0;
  localStorage.removeItem('gcal_access_token'); localStorage.removeItem('gcal_token_expiry');
  loadMeetings();
}
function handleGcalCallback() {
  const hash = window.location.hash.substring(1); if(!hash) return;
  const params = Object.fromEntries(new URLSearchParams(hash));
  if (params.access_token) {
    gcalAccessToken = params.access_token;
    gcalTokenExpiry = Date.now() + (parseInt(params.expires_in||'3600')*1000);
    localStorage.setItem('gcal_access_token', gcalAccessToken);
    localStorage.setItem('gcal_token_expiry', String(gcalTokenExpiry));
    history.replaceState(null,'',window.location.pathname);
    loadMeetings();
  }
}
document.addEventListener('DOMContentLoaded', () => { if (sessionStorage.getItem('jc_auth') === '1') init(); });
</script>
<script>
let inquiriesData = [], activeInquiryEmail = null, inquiryHsCache = {}, inquiryStatusDebounce = null;

const LEAD_STATUS_OPTIONS = [
  {value:'',label:'— No status —'},{value:'NEW',label:'New'},{value:'OPEN',label:'Open'},
  {value:'IN_PROGRESS',label:'In Progress'},{value:'OPEN_DEAL',label:'Open Deal'},
  {value:'UNQUALIFIED',label:'Unqualified'},{value:'ATTEMPTED_TO_CONTACT',label:'Attempted to Contact'},
  {value:'CONNECTED',label:'Connected'},{value:'BAD_TIMING',label:'Bad Timing'},
];

async function init() {
  await loadInquiries();
}

async function loadInquiries() {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('spinning');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/hubspot_enquiries?select=*&bd_flagged=eq.true&order=bd_flagged_at.desc&limit=100`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    if (!res.ok) throw new Error(`Supabase ${res.status}`);
    const rows = await res.json();
    inquiriesData = rows.map(r => ({
      id:r.id, submittedAt:new Date(r.submitted_at).getTime(),
      flaggedAt:r.bd_flagged_at?new Date(r.bd_flagged_at).getTime():null,
      firstname:r.firstname||'', lastname:r.lastname||'', email:r.email||'',
      company:r.company||'', message:r.message||'', bdNotes:r.bd_notes||''
    }));
    document.getElementById('inq-count').textContent = inquiriesData.length;
    renderInquiries(inquiriesData);
  } catch(e) {
    document.getElementById('inquiries-list').innerHTML = `<div class="empty-state">Unable to load — ${e.message}</div>`;
  }
  if (btn) btn.classList.remove('spinning');
}

function renderInquiries(inquiries) {
  const container = document.getElementById('inquiries-list');
  if (!inquiries.length) {
    container.innerHTML = '<div class="empty-state">No BD-flagged inquiries yet.</div>';
    return;
  }
  container.innerHTML = '';
  inquiries.forEach((e, i) => {
    const row = document.createElement('div');
    row.className = 'inquiry-row';
    row.style.animationDelay = `${i*0.04}s`;
    row.dataset.email = e.email;
    const flaggedDate = e.flaggedAt ? new Date(e.flaggedAt).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '—';
    const name = [e.firstname,e.lastname].filter(Boolean).join(' ') || '—';
    row.innerHTML = `
      <div class="inquiry-name">${e.company||name}</div>
      <div class="inquiry-company">${name!==e.company?name:e.email}</div>
      <div class="inquiry-meta"><span class="inquiry-date">Flagged ${flaggedDate}</span></div>`;
    row.addEventListener('click', () => selectInquiry(e, row));
    container.appendChild(row);
  });
  const first = container.querySelector('.inquiry-row');
  if (first) first.click();
}

async function selectInquiry(e, rowEl) {
  document.querySelectorAll('.inquiry-row').forEach(r => r.classList.remove('active'));
  rowEl.classList.add('active');
  activeInquiryEmail = e.email;
  const name = [e.firstname,e.lastname].filter(Boolean).join(' ') || '—';
  const msgBody = document.getElementById('inquiries-message-body');
  const statusBody = document.getElementById('inquiries-status-body');
  const renderMsg = (msg) => {
    msgBody.innerHTML = `
      <div class="inq-message-company">${e.company||name}</div>
      <div class="inq-message-contact">${name!==e.company?name:''}</div>
      <div class="inq-message-body">${(msg||'No message content.').replace(/</g,'&lt;')}</div>
      <div class="inq-message-email">${e.email}</div>`;
  };
  renderMsg(e.message);
  statusBody.innerHTML = '<div class="inq-status-empty" style="font-size:11px">Looking up HubSpot contact…</div>';
  let contactId=null, currentStatus='', latestNote=null;
  if (inquiryHsCache[e.email]) {
    ({id:contactId, hs_lead_status:currentStatus, latest_note:latestNote} = inquiryHsCache[e.email]);
    if (inquiryHsCache[e.email].hs_message) renderMsg(inquiryHsCache[e.email].hs_message);
  } else {
    try {
      const res = await fetch(HS_PROXY, {
        method:'POST',
        headers:{'Authorization':`Bearer ${SUPABASE_KEY}`,'x-proxy-target':'hubspot','x-hs-path':'/crm/v3/objects/contacts/search','Content-Type':'application/json'},
        body:JSON.stringify({filterGroups:[{filters:[{propertyName:'email',operator:'EQ',value:e.email}]}],properties:['email','firstname','lastname','hs_lead_status','company','message'],limit:1})
      });
      const data = await res.json();
      if (data.results && data.results.length > 0) {
        const c = data.results[0];
        contactId = c.id; currentStatus = c.properties.hs_lead_status||'';
        const hsMsg = c.properties.message||'';
        if (!e.message && hsMsg && activeInquiryEmail===e.email) renderMsg(hsMsg);
        let noteBody='', noteDate='';
        try {
          const aRes = await fetch(HS_PROXY, {headers:{'Authorization':`Bearer ${SUPABASE_KEY}`,'x-proxy-target':'hubspot','x-hs-path':`/crm/v3/objects/contacts/${contactId}/associations/notes`}});
          const aData = await aRes.json();
          const noteIds = (aData.results||[]).map(r=>r.id);
          if (noteIds.length) {
            const bRes = await fetch(HS_PROXY, {method:'POST',headers:{'Authorization':`Bearer ${SUPABASE_KEY}`,'x-proxy-target':'hubspot','x-hs-path':'/crm/v3/objects/notes/batch/read','Content-Type':'application/json'},body:JSON.stringify({inputs:noteIds.slice(0,10).map(id=>({id})),properties:['hs_note_body','hs_createdate']})});
            const bData = await bRes.json();
            const notes = (bData.results||[]).filter(n=>(n.properties.hs_note_body||'').includes('[Activity Dashboard Note]')).sort((a,b)=>new Date(b.properties.hs_createdate)-new Date(a.properties.hs_createdate));
            if (notes.length) {
              let raw = notes[0].properties.hs_note_body||'';
              if (raw.includes('<')) raw=raw.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&');
              const lines=raw.split('\n').map(l=>l.trim());
              const si=lines.findIndex(l=>l.startsWith('[Activity Dashboard Note]'));
              noteBody=lines.slice(si>=0?si+2:0).join('\n').trim();
              noteDate=new Date(notes[0].properties.hs_createdate).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
            }
          }
        } catch(_) {}
        latestNote={body:noteBody,date:noteDate};
        inquiryHsCache[e.email]={id:contactId,hs_lead_status:currentStatus,hs_message:hsMsg,latest_note:latestNote};
      }
    } catch(err) { console.error(err); }
  }
  if (activeInquiryEmail !== e.email) return;
  if (!contactId) { statusBody.innerHTML='<div class="inq-status-empty">Contact not found in HubSpot.</div>'; return; }
  const statusOpts = LEAD_STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${currentStatus===o.value?'selected':''}>${o.label}</option>`).join('');
  const noteHtml = latestNote && latestNote.body
    ? `<div style="background:var(--cream-soft);border:1px solid var(--grey-light);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--black);white-space:pre-wrap;word-break:break-word;">${latestNote.body.replace(/</g,'&lt;')}</div><div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey-mid);margin-top:5px;text-align:right;">Saved ${latestNote.date}</div>`
    : '<div style="font-size:12px;color:var(--grey-mid);font-style:italic;">No notes yet.</div>';
  statusBody.innerHTML = `
    <div class="inq-label">Lead Status</div>
    <select class="inq-status-select" id="inq-status-select">${statusOpts}</select>
    <div class="inq-label">Latest Note</div>
    <div id="inq-latest-note-block" style="margin-bottom:14px">${noteHtml}</div>
    <div class="inq-label">Add New Note</div>
    <textarea class="inq-notes-textarea" id="inq-notes-textarea" placeholder="e.g. Proposal sent — awaiting response…"></textarea>
    <button class="inq-save-note-btn" id="inq-save-note-btn">Save Note to HubSpot</button>
    <div class="inq-save-status" id="inq-save-status"></div>`;
  const selEl=document.getElementById('inq-status-select'), notesEl=document.getElementById('inq-notes-textarea');
  const saveBtn=document.getElementById('inq-save-note-btn'), saveStatus=document.getElementById('inq-save-status');
  selEl.addEventListener('change', () => {
    const ns=selEl.value; inquiryHsCache[e.email].hs_lead_status=ns;
    clearTimeout(inquiryStatusDebounce);
    saveStatus.textContent='Saving…'; saveStatus.className='inq-save-status saving';
    inquiryStatusDebounce = setTimeout(async () => {
      try {
        const r=await fetch(HS_PROXY,{method:'PATCH',headers:{'Authorization':`Bearer ${SUPABASE_KEY}`,'x-proxy-target':'hubspot','x-hs-path':`/crm/v3/objects/contacts/${contactId}`,'Content-Type':'application/json'},body:JSON.stringify({properties:{hs_lead_status:ns||null}})});
        if (!r.ok) throw new Error(r.status);
        saveStatus.textContent='Status saved ✓'; saveStatus.className='inq-save-status saved';
        setTimeout(()=>{if(saveStatus.textContent.includes('Status'))saveStatus.textContent='';},3000);
      } catch(err){ saveStatus.textContent='Error saving'; saveStatus.className='inq-save-status error'; }
    }, 600);
  });
  saveBtn.addEventListener('click', async () => {
    if (!notesEl.value.trim()) return;
    saveBtn.disabled=true; saveStatus.textContent='Saving…'; saveStatus.className='inq-save-status saving';
    const noteText=notesEl.value, nm=[e.firstname,e.lastname].filter(Boolean).join(' ')||e.email;
    const body=`[Activity Dashboard Note]\n${e.company?e.company+' — ':''}${nm}\n\n${noteText}`;
    try {
      const r=await fetch(HS_PROXY,{method:'POST',headers:{'Authorization':`Bearer ${SUPABASE_KEY}`,'x-proxy-target':'hubspot','x-hs-path':'/crm/v3/objects/notes','Content-Type':'application/json'},body:JSON.stringify({properties:{hs_timestamp:new Date().toISOString(),hs_note_body:body},associations:[{to:{id:contactId},types:[{associationCategory:'HUBSPOT_DEFINED',associationTypeId:202}]}]})});
      if (!r.ok) throw new Error(r.status);
      saveStatus.textContent='Note saved ✓'; saveStatus.className='inq-save-status saved';
      if(inquiryHsCache[e.email]) inquiryHsCache[e.email].latest_note={body:noteText,date:'Just now'};
      const lnEl=document.getElementById('inq-latest-note-block');
      if(lnEl) lnEl.innerHTML=`<div style="background:var(--cream-soft);border:1px solid var(--grey-light);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.6;color:var(--black);white-space:pre-wrap;">${noteText.replace(/</g,'&lt;')}</div><div style="font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;color:var(--grey-mid);margin-top:5px;text-align:right;">Saved Just now</div>`;
      notesEl.value='';
      setTimeout(()=>{if(saveStatus.textContent.includes('Note'))saveStatus.textContent='';},3000);
    } catch(err){ saveStatus.textContent='Error saving'; saveStatus.className='inq-save-status error'; }
    saveBtn.disabled=false;
  });
}
</script>
<script>window.JUNGLE_NAV_ACTIVE = 'inquiries';</script>
<script src="https://jungle-is-massive.github.io/hub/jungle-leftnav.js"></script>
