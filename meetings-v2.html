<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle — Meetings</title>
<link rel="icon" type="image/png" href="https://junglecreations.com/favicon-32x32.png?v=1b5e54ab68eeaed11a7dbfe7d0035e99">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F5F0E8; --cream-soft: #EFE9DF; --black: #0E0E0E; --green: #87FB66;
  --grey: #C8C3B8; --grey-mid: #8A8880; --grey-light: #E8E3DA; --white: #FFFFFF;
  --header-h: 56px; --coral: #FF6B4A; --amber: #F0B429; --teal: #3ECF8E; --next: #4ABFFF;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); color: var(--black); font-family: 'DM Sans', system-ui, sans-serif; height: 100%; -webkit-font-smoothing: antialiased; }

#topbar { position: fixed; top: 0; right: 0; left: 52px; z-index: 100; height: var(--header-h); background: var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.topbar-title { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.tbtn { display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 14px; border-radius: 100px; cursor: pointer; transition: all 0.15s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.55); }
.tbtn:hover { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.9); }
.tbtn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tbtn.spinning svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

#main { position: fixed; top: var(--header-h); left: 52px; right: 0; bottom: 0; overflow-y: auto; }

#gate-overlay { position: fixed; inset: 0; z-index: 999; background: var(--black); display: flex; align-items: center; justify-content: center; }
.gate-box { text-align: center; }
.gate-wm { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; color: var(--white); margin-bottom: 28px; display: block; }
.gate-wm span { color: var(--green); }
.gate-input { display: block; width: 240px; padding: 12px 18px; margin: 0 auto 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; color: var(--white); font-size: 15px; text-align: center; font-family: 'DM Mono', monospace; letter-spacing: 0.15em; outline: none; }
.gate-input:focus { border-color: var(--green); }
.gate-btn { width: 240px; padding: 11px; background: var(--green); color: var(--black); border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }
.gate-error { color: var(--coral); font-size: 12px; margin-top: 10px; font-family: 'DM Mono', monospace; min-height: 18px; }

/* GCal bar */
#gcal-bar { margin: 16px 24px 0; padding: 14px 18px; background: var(--black); border-radius: 12px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
#gcal-bar.hidden { display: none; }
#gcal-bar-text { color: rgba(255,255,255,0.75); font-size: 13px; }
#gcal-bar-text strong { color: var(--white); }
#gcal-bar-text p { font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 3px; }
.gcal-bar-btn { display: flex; align-items: center; gap: 7px; padding: 9px 16px; background: var(--green); color: var(--black); border: none; border-radius: 9px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0; font-family: 'DM Sans', sans-serif; }
.gcal-bar-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }

/* Tabs */
.meeting-tabs { display: flex; gap: 6px; padding: 16px 24px 0; }
.mtab { display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 7px 14px; border-radius: 100px; border: 1.5px solid var(--grey-light); background: transparent; color: var(--grey-mid); cursor: pointer; transition: all 0.15s; }
.mtab:hover { border-color: var(--black); color: var(--black); }
.mtab.active { background: var(--black); color: var(--cream); border-color: var(--black); }
.mtab-count { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 20px; }
.mtab.active .mtab-count { background: rgba(255,255,255,0.2); }
.mtab:not(.active) .mtab-count { background: var(--grey-light); color: var(--grey-mid); }

#sync-badge { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey-mid); padding: 8px 24px 0; display: flex; align-items: center; gap: 6px; min-height: 26px; }

/* Meeting grid */
#meetings-grid { padding: 16px 24px 40px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.meeting-card { background: var(--white); border: 1.5px solid var(--grey-light); border-radius: 14px; padding: 18px 20px; position: relative; overflow: hidden; animation: cardIn 0.22s ease both; }
.meeting-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--teal); }
@keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.meeting-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.meeting-datetime { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey-mid); }
.meeting-title { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; margin-bottom: 5px; }
.meeting-company { font-size: 12px; color: var(--grey-mid); margin-bottom: 8px; }
.meeting-next { background: var(--cream-soft); border-radius: 8px; padding: 10px 12px; font-size: 12px; color: var(--grey-mid); line-height: 1.5; margin-top: 8px; }
.meeting-next-label { font-family: 'DM Mono', monospace; font-size: 8px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey-mid); margin-bottom: 4px; }
.empty-state { padding: 40px 24px; color: var(--grey-mid); font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>

<div id="gate-overlay">
  <div class="gate-box">
    <span class="gate-wm">jungle<span>.</span></span>
    <input id="gate-input" class="gate-input" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkGate()">
    <button class="gate-btn" onclick="checkGate()">Enter</button>
    <div class="gate-error" id="gate-error"></div>
  </div>
</div>

<div id="topbar">
  <span class="topbar-title">Meetings</span>
  <div class="topbar-right">
    <button class="tbtn" id="refresh-btn" onclick="loadMeetings()">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c-1.66 0-3-4.03-3-9s1.34-9 3-9m0 18c1.66 0 3-4.03 3-9s-1.34-9-3-9m-9 9a9 9 0 019-9"/></svg>
      Refresh
    </button>
  </div>
</div>

<div id="main">
  <div id="gcal-bar" class="hidden">
    <div id="gcal-bar-text">
      <strong>Connect Google Calendar</strong>
      <p>Sign in to pull your #nbm and #netm tagged meetings into the dashboard.</p>
    </div>
    <button class="gcal-bar-btn" onclick="gcalSignIn()">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Connect Google Calendar
    </button>
  </div>

  <div class="meeting-tabs">
    <button class="mtab active" id="mtab-upcoming" onclick="switchMeetingTab('upcoming')">
      Upcoming <span class="mtab-count" id="mtab-count-upcoming">—</span>
    </button>
    <button class="mtab" id="mtab-attended" onclick="switchMeetingTab('attended')">
      Attended <span class="mtab-count" id="mtab-count-attended">—</span>
    </button>
  </div>

  <div id="sync-badge"></div>
  <div id="meetings-grid"><div class="empty-state">Loading meetings…</div></div>
</div>

<script src="https://jungle-is-massive.github.io/hub/config.js"></script>
<script src="https://jungle-is-massive.github.io/hub/hub-overlay.js" defer></script>
<script>
const GATE_PASSWORD = 'massive';
function checkGate() {
  const v = document.getElementById('gate-input').value.trim();
  if (v === GATE_PASSWORD) { sessionStorage.setItem('jc_auth','1'); document.getElementById('gate-overlay').remove(); init(); }
  else { document.getElementById('gate-error').textContent = 'Wrong password.'; document.getElementById('gate-input').value = ''; }
}
if (sessionStorage.getItem('jc_auth') === '1') document.getElementById('gate-overlay').remove();

const SUPABASE_URL = (window.JUNGLE_CONFIG||{}).SB_URL || '';
const SUPABASE_KEY = (window.JUNGLE_CONFIG||{}).SB_KEY || '';
const GCAL_CLIENT_ID = '161148155885-jmk24mva9i9akjknkes29kso7n1c9bgl.apps.googleusercontent.com';
let gcalAccessToken = localStorage.getItem('gcal_access_token') || '';
let gcalTokenExpiry = parseInt(localStorage.getItem('gcal_token_expiry') || '0');
let meetingsUpcoming = [], meetingsAttended = [], activeTab = 'upcoming';

function gcalIsConnected() { return gcalAccessToken && Date.now() < gcalTokenExpiry; }
function gcalSignIn() {
  const redirect = encodeURIComponent(window.location.href.split('?')[0].split('#')[0]);
  window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GCAL_CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=${encodeURIComponent('https://www.googleapis.com/auth/calendar.events.readonly')}&prompt=select_account`;
}
function gcalSignOut() {
  gcalAccessToken = ''; gcalTokenExpiry = 0;
  localStorage.removeItem('gcal_access_token'); localStorage.removeItem('gcal_token_expiry');
  updateGcalBar(); loadMeetings();
}
function handleGcalCallback() {
  const hash = window.location.hash.substring(1); if (!hash) return;
  const params = Object.fromEntries(new URLSearchParams(hash));
  if (params.access_token) {
    gcalAccessToken = params.access_token;
    gcalTokenExpiry = Date.now() + (parseInt(params.expires_in||'3600') * 1000);
    localStorage.setItem('gcal_access_token', gcalAccessToken);
    localStorage.setItem('gcal_token_expiry', String(gcalTokenExpiry));
    history.replaceState(null, '', window.location.pathname);
    updateGcalBar(); loadMeetings();
  }
}
function updateGcalBar() {
  document.getElementById('gcal-bar').classList.toggle('hidden', gcalIsConnected());
}

document.addEventListener('DOMContentLoaded', () => { if (sessionStorage.getItem('jc_auth') === '1') init(); });

async function init() { handleGcalCallback(); updateGcalBar(); await loadMeetings(); }

async function loadMeetingsFromSupabase() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/bd_meetings?select=*&order=start_datetime.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
    if (!res.ok) return null;
    const rows = await res.json();
    if (!rows || !rows.length) return null;
    const toEvent = r => ({ id: r.id, summary: r.summary, description: r.description,
      start: { dateTime: r.start_datetime }, end: { dateTime: r.end_datetime },
      attendees: (() => { try { return JSON.parse(r.attendees||'[]'); } catch(e) { return []; } })() });
    return {
      upcoming: rows.filter(r => r.is_upcoming).map(toEvent),
      attended: rows.filter(r => !r.is_upcoming).map(toEvent).reverse(),
      syncedAt: rows[0]?.synced_at, syncedBy: rows[0]?.synced_by || 'Coris'
    };
  } catch(e) { return null; }
}

function setSyncBadge(syncedAt, syncedBy, isLive) {
  const el = document.getElementById('sync-badge');
  if (isLive) {
    el.innerHTML = '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green)"></span> Live';
  } else if (syncedAt) {
    const d = new Date(syncedAt);
    el.textContent = `Synced by ${syncedBy} · ${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} · ${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`;
  } else { el.textContent = ''; }
}

async function loadMeetings() {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('spinning');

  if (!gcalIsConnected()) {
    const cached = await loadMeetingsFromSupabase();
    if (cached && (cached.upcoming.length || cached.attended.length)) {
      meetingsUpcoming = cached.upcoming; meetingsAttended = cached.attended;
      document.getElementById('mtab-count-upcoming').textContent = cached.upcoming.length;
      document.getElementById('mtab-count-attended').textContent = cached.attended.length;
      renderMeetings(activeTab);
      setSyncBadge(cached.syncedAt, cached.syncedBy, false);
    } else {
      document.getElementById('meetings-grid').innerHTML =
        '<div class="empty-state">Connect Google Calendar above to pull your #nbm and #netm meetings.</div>';
    }
    if (btn) btn.classList.remove('spinning');
    return;
  }

  try {
    const now = new Date(), future = new Date(now.getTime()+30*86400000), past = new Date(now.getTime()-30*86400000);
    const [upRes, paRes] = await Promise.all([
      fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(now.toISOString())}&timeMax=${encodeURIComponent(future.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=50`,
        { headers: { Authorization: `Bearer ${gcalAccessToken}` } }),
      fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${encodeURIComponent(past.toISOString())}&timeMax=${encodeURIComponent(now.toISOString())}&singleEvents=true&orderBy=startTime&maxResults=100`,
        { headers: { Authorization: `Bearer ${gcalAccessToken}` } })
    ]);
    if (!upRes.ok) throw new Error(`Calendar ${upRes.status}`);
    const [upData, paData] = await Promise.all([upRes.json(), paRes.json()]);
    const filterBD = ev => { const d = (ev.description||'').toLowerCase(); return d.includes('#nbm') || d.includes('#netm'); };
    meetingsUpcoming = (upData.items||[]).filter(filterBD);
    meetingsAttended = (paData.items||[]).filter(filterBD).reverse();
    document.getElementById('mtab-count-upcoming').textContent = meetingsUpcoming.length;
    document.getElementById('mtab-count-attended').textContent = meetingsAttended.length;
    renderMeetings(activeTab);
    setSyncBadge(null, null, true);
  } catch(e) {
    if (e.message.includes('401') || e.message.includes('403')) { gcalSignOut(); }
    document.getElementById('meetings-grid').innerHTML = `<div class="empty-state">Unable to load meetings — ${e.message}</div>`;
  }
  if (btn) btn.classList.remove('spinning');
}

function switchMeetingTab(tab) {
  activeTab = tab;
  document.getElementById('mtab-upcoming').classList.toggle('active', tab === 'upcoming');
  document.getElementById('mtab-attended').classList.toggle('active', tab === 'attended');
  renderMeetings(tab);
}

function renderMeetings(tab) {
  const container = document.getElementById('meetings-grid');
  const meetings = tab === 'upcoming' ? meetingsUpcoming : meetingsAttended;
  if (!meetings.length) {
    container.innerHTML = `<div class="empty-state">${tab === 'upcoming'
      ? 'No upcoming BD meetings in the next 30 days. Add <strong>#nbm</strong> or <strong>#netm</strong> to a Google Calendar event description.'
      : 'No BD meetings attended in the last 30 days.'}</div>`;
    return;
  }
  const now = new Date();
  container.innerHTML = '';
  meetings.forEach((ev, i) => {
    const start = new Date(ev.start?.dateTime || ev.start?.date);
    const isToday = start.toDateString() === now.toDateString();
    const isTomorrow = start.toDateString() === new Date(now.getTime()+86400000).toDateString();
    const isYesterday = tab === 'attended' && start.toDateString() === new Date(now.getTime()-86400000).toDateString();
    const dateLabel = isToday ? 'Today' : isTomorrow ? 'Tomorrow' : isYesterday ? 'Yesterday'
      : start.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const timeStr = ev.start?.dateTime ? start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) : 'All day';
    const desc = (ev.description||'').replace(/#nbm|#netm/gi,'').replace(/<[^>]+>/g,'').trim();
    const isNbm = (ev.description||'').toLowerCase().includes('#nbm');
    const tagColour = isNbm ? 'var(--green)' : 'var(--next)';
    const tagText = isNbm ? 'var(--black)' : 'white';
    const attendees = (ev.attendees||[]).filter(a => !a.self).map(a => a.displayName || a.email).slice(0,3).join(', ');
    const card = document.createElement('div');
    card.className = 'meeting-card';
    card.style.animationDelay = `${i * 0.06}s`;
    card.innerHTML = `
      <div class="meeting-top">
        <div class="meeting-datetime">${dateLabel}${timeStr !== 'All day' ? ' · ' + timeStr : ''}</div>
        <span style="font-family:'DM Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:${tagColour};color:${tagText};white-space:nowrap">${isNbm ? 'New Business' : 'Network'}</span>
      </div>
      <div class="meeting-title">${ev.summary || 'Untitled'}</div>
      ${attendees ? `<div class="meeting-company">${attendees}</div>` : ''}
      ${desc ? `<div class="meeting-next"><div class="meeting-next-label">Notes</div>${desc.substring(0,150)}${desc.length>150?'…':''}</div>` : ''}`;
    container.appendChild(card);
  });
}
</script>
<script>window.JUNGLE_NAV_ACTIVE = 'meetings';</script>
<script src="https://jungle-is-massive.github.io/hub/jungle-leftnav.js"></script>
</body>
</html>
