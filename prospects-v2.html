<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jungle — Prospects</title>
<link rel="icon" type="image/png" href="https://junglecreations.com/favicon-32x32.png?v=1b5e54ab68eeaed11a7dbfe7d0035e99">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F5F0E8; --cream-soft: #EFE9DF; --black: #0E0E0E; --green: #87FB66;
  --grey: #C8C3B8; --grey-mid: #8A8880; --grey-light: #E8E3DA; --white: #FFFFFF;
  --header-h: 56px; --coral: #FF6B4A; --amber: #F0B429; --teal: #3ECF8E;
}
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); color: var(--black); font-family: 'DM Sans', system-ui, sans-serif; height: 100%; -webkit-font-smoothing: antialiased; overflow: hidden; }

/* ── TOPBAR ─────────────────────────────────────────────────── */
#topbar { position: fixed; top: 0; right: 0; left: 52px; z-index: 100; height: var(--header-h); background: var(--black); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.topbar-title { font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(255,255,255,0.35); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.tbtn { display: flex; align-items: center; gap: 6px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 14px; border-radius: 100px; cursor: pointer; transition: all 0.15s; white-space: nowrap; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.55); }
.tbtn:hover { border-color: rgba(255,255,255,0.35); color: rgba(255,255,255,0.9); }
.tbtn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.tbtn.spinning svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── GATE ────────────────────────────────────────────────────── */
#gate-overlay { position: fixed; inset: 0; z-index: 999; background: var(--black); display: flex; align-items: center; justify-content: center; }
.gate-box { text-align: center; }
.gate-wm { font-size: 28px; font-weight: 800; letter-spacing: -0.04em; color: var(--white); margin-bottom: 28px; display: block; }
.gate-wm span { color: var(--green); }
.gate-input { display: block; width: 240px; padding: 12px 18px; margin: 0 auto 12px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: 10px; color: var(--white); font-size: 15px; text-align: center; font-family: 'DM Mono', monospace; letter-spacing: 0.15em; outline: none; }
.gate-input:focus { border-color: var(--green); }
.gate-btn { width: 240px; padding: 11px; background: var(--green); color: var(--black); border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase; }
.gate-error { color: var(--coral); font-size: 12px; margin-top: 10px; font-family: 'DM Mono', monospace; min-height: 18px; }

/* ── FULL-PAGE LAYOUT ────────────────────────────────────────── */
#prospects-page { position: fixed; top: var(--header-h); left: 52px; right: 0; bottom: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--cream); }

/* ── HEADER ──────────────────────────────────────────────────── */
.prsp-header { flex-shrink: 0; padding: 22px 32px 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; max-width: 1320px; margin: 0 auto; width: 100%; }
#prsp-page-title { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; color: var(--black); }
#prsp-page-sub { margin: 4px 0 0; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--grey-mid); }

/* ── SUB-TABS ────────────────────────────────────────────────── */
.prsp-sub-tabs-bar { flex-shrink: 0; max-width: 1320px; margin: 0 auto; width: 100%; padding: 16px 32px 0; border-bottom: 1.5px solid var(--grey-light); display: flex; gap: 0; align-items: flex-end; }
.prsp-sub-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 10px 18px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; color: var(--grey-mid); cursor: pointer; transition: all 0.15s; margin-bottom: -1.5px; white-space: nowrap; }
.prsp-sub-tab:hover { color: var(--black); }
.prsp-sub-tab.active { color: var(--black); border-bottom-color: var(--black); }

/* ── BODY ────────────────────────────────────────────────────── */
.prsp-body { flex: 1; overflow: auto; position: relative; }
.prsp-inner { padding: 24px 32px 90px; max-width: 1320px; margin: 0 auto; }

/* ── CONTROLS ────────────────────────────────────────────────── */
.prsp-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.prsp-search { flex: 1; max-width: 360px; border: 1.5px solid var(--grey-light); border-radius: 100px; padding: 9px 16px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; color: var(--black); background: var(--white); transition: border-color 0.15s; }
.prsp-search:focus { border-color: var(--black); }
.prsp-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--grey-mid); letter-spacing: 0.04em; }

/* ── TABLE ───────────────────────────────────────────────────── */
.prsp-table-wrap { width: 100%; overflow-x: auto; border-radius: 12px; box-shadow: 0 0 0 1.5px var(--grey-light); }
.prsp-table { width: 100%; border-collapse: collapse; background: var(--white); font-size: 12px; }
.prsp-table th { font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey-mid); padding: 10px 14px; text-align: left; background: var(--grey-light); border-bottom: 1px solid var(--grey-light); white-space: nowrap; }
.prsp-table td { padding: 11px 14px; border-bottom: 1px solid var(--grey-light); vertical-align: top; color: var(--black); line-height: 1.4; }
.prsp-table tbody tr:last-child td { border-bottom: none; }
.prsp-table tbody tr:hover td { background: rgba(0,0,0,0.018); }
.prsp-table td a { color: var(--black); text-decoration: none; border-bottom: 1px solid var(--grey); transition: border-color 0.15s; }
.prsp-table td a:hover { border-color: var(--black); }
.prsp-empty { text-align: center; padding: 32px; color: var(--grey-mid); font-size: 13px; font-style: italic; }
.prsp-loading { display: flex; align-items: center; gap: 10px; padding: 64px 0; justify-content: center; font-size: 13px; color: var(--grey-mid); }
.prsp-spinner { width: 16px; height: 16px; border: 2px solid var(--grey-light); border-top-color: var(--black); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }

/* ── STATUS PILLS ────────────────────────────────────────────── */
.bd-status-pill { display: inline-block; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; white-space: nowrap; }
.s-warm-progress { background: rgba(135,251,102,0.15); color: #2a6600; }
.s-inprogress { background: rgba(74,191,255,0.12); color: #1a5a8a; }
.s-linkedin { background: rgba(0,119,181,0.1); color: #0a4a70; }
.s-not-started { background: var(--cream-soft); color: var(--grey-mid); }
.s-low { background: rgba(240,180,41,0.12); color: #8a5500; }

/* ── EMAIL BUTTON ────────────────────────────────────────────── */
.mm-email-btn { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 10px; background: rgba(135,251,102,0.12); border: 1px solid rgba(135,251,102,0.25); border-radius: 100px; color: #2a6600; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: background 0.12s, border-color 0.12s; white-space: nowrap; }
.mm-email-btn:hover { background: rgba(135,251,102,0.22); border-color: rgba(135,251,102,0.5); }
.mm-email-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── LAST COMMS ──────────────────────────────────────────────── */
.mm-lastcomms-direction { display: inline-flex; align-items: center; gap: 4px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border-radius: 20px; white-space: nowrap; margin-bottom: 4px; }
.mm-lc-sent { background: rgba(135,251,102,0.12); color: #1a6a30; }
.mm-lc-received { background: rgba(74,191,255,0.12); color: #1a5a8a; }
.mm-lc-subject { font-size: 12px; font-weight: 600; color: var(--black); line-height: 1.3; margin-bottom: 2px; }
.mm-lc-snippet { font-size: 11px; color: #777; line-height: 1.4; max-width: 260px; }
.mm-lc-date { font-family: 'DM Mono', monospace; font-size: 9px; color: #aaa; margin-top: 3px; }
.mm-lc-none { font-size: 11px; color: #bbb; font-style: italic; }
.mm-lc-loading { font-size: 11px; color: #bbb; }
.mm-lc-hs-link { display: inline-block; margin-top: 4px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: #aaa; text-decoration: none; border-bottom: 1px solid #ddd; transition: color 0.12s, border-color 0.12s; }
.mm-lc-hs-link:hover { color: var(--black); border-color: var(--black); }

/* ── EMAIL COMPOSE MODAL ─────────────────────────────────────── */
#email-compose-modal { position: fixed; inset: 0; background: rgba(14,14,14,0.65); backdrop-filter: blur(4px); z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
#email-compose-modal.open { opacity: 1; pointer-events: all; }
#email-compose-box { background: var(--cream); border-radius: 16px; width: min(620px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.3); transform: translateY(16px); transition: transform 0.2s; }
#email-compose-modal.open #email-compose-box { transform: translateY(0); }
.ecm-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px 14px; border-bottom: 1px solid var(--grey-light); }
.ecm-title { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
.ecm-close { background: none; border: none; cursor: pointer; font-size: 16px; color: var(--grey-mid); padding: 2px 6px; border-radius: 6px; transition: color 0.12s, background 0.12s; }
.ecm-close:hover { color: var(--black); background: var(--grey-light); }
.ecm-body { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
.ecm-templates { display: flex; gap: 6px; flex-wrap: wrap; }
.ecm-template-pill { height: 28px; padding: 0 12px; background: var(--grey-light); border: 1.5px solid transparent; border-radius: 100px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--grey-mid); cursor: pointer; transition: all 0.12s; }
.ecm-template-pill:hover { background: var(--black); color: var(--green); }
.ecm-template-pill.active { background: var(--black); color: var(--green); border-color: var(--green); }
.ecm-field label { display: block; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--grey-mid); margin-bottom: 6px; }
.ecm-field input, .ecm-field textarea { width: 100%; border: 1.5px solid var(--grey-light); border-radius: 8px; padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--black); background: var(--white); outline: none; transition: border-color 0.15s; box-sizing: border-box; resize: vertical; }
.ecm-field input:focus, .ecm-field textarea:focus { border-color: var(--black); }
.ecm-footer { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px 20px; gap: 10px; }
.ecm-send-btn { height: 38px; padding: 0 22px; background: var(--black); color: var(--green); border: none; border-radius: 100px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; transition: opacity 0.15s; }
.ecm-send-btn:hover { opacity: 0.85; }
.ecm-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.ecm-cancel-btn { height: 38px; padding: 0 16px; background: none; border: 1.5px solid var(--grey-light); border-radius: 100px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--grey-mid); cursor: pointer; transition: border-color 0.15s, color 0.15s; }
.ecm-cancel-btn:hover { border-color: var(--black); color: var(--black); }
.ecm-no-token { padding: 12px 14px; background: rgba(240,180,41,0.1); border: 1px solid rgba(240,180,41,0.25); border-radius: 8px; font-size: 12px; color: var(--grey-mid); line-height: 1.5; }
.ecm-no-token a { color: var(--black); font-weight: 600; }
</style>
</head>

<script>
// ── Gate ──────────────────────────────────────────────────────────────────
const GATE_PASSWORD = 'massive';
function checkGate() {
  const v = document.getElementById('gate-input').value.trim();
  if (v === GATE_PASSWORD) { sessionStorage.setItem('jc_auth','1'); document.getElementById('gate-overlay').remove(); init(); }
  else { document.getElementById('gate-error').textContent = 'Wrong password.'; document.getElementById('gate-input').value = ''; }
}
if (sessionStorage.getItem('jc_auth') === '1') document.getElementById('gate-overlay').remove();

document.addEventListener('DOMContentLoaded', () => { if (sessionStorage.getItem('jc_auth') === '1') init(); });

// ── Config ────────────────────────────────────────────────────────────────
const SUPABASE_URL = (window.JUNGLE_CONFIG||{}).SB_URL || 'https://iehkvlyjumkzccoqqgxl.supabase.co';
const SUPABASE_KEY = (window.JUNGLE_CONFIG||{}).SB_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllaGt2bHlqdW1remNjb3FxZ3hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MTMwNzYsImV4cCI6MjA5MTM4OTA3Nn0.pF9K9aBwWN10JRT_ODTLPzsdPKH3X0CW30WrPMn9lGs';
const HS_PROXY = `${SUPABASE_URL}/functions/v1/hs-proxy`;
const GCAL_CLIENT_ID = '161148155885-jmk24mva9i9akjknkes29kso7n1c9bgl.apps.googleusercontent.com';
let gcalAccessToken = localStorage.getItem('gcal_access_token') || '';
let gcalTokenExpiry = parseInt(localStorage.getItem('gcal_token_expiry') || '0');
function gcalIsConnected() { return gcalAccessToken && Date.now() < gcalTokenExpiry; }
function gcalSignIn() {
  const redirect = encodeURIComponent(window.location.href.split('?')[0].split('#')[0]);
  window.location.href = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GCAL_CLIENT_ID}&redirect_uri=${redirect}&response_type=token&scope=${encodeURIComponent('https://www.googleapis.com/auth/gmail.send')}&prompt=select_account`;
}
function gcalSignOut() {
  gcalAccessToken = ''; gcalTokenExpiry = 0;
  localStorage.removeItem('gcal_access_token'); localStorage.removeItem('gcal_token_expiry');
}
function handleGcalCallback() {
  const hash = window.location.hash.substring(1); if (!hash) return;
  const params = Object.fromEntries(new URLSearchParams(hash));
  if (params.access_token) {
    gcalAccessToken = params.access_token;
    gcalTokenExpiry = Date.now() + (parseInt(params.expires_in||'3600') * 1000);
    localStorage.setItem('gcal_access_token', gcalAccessToken);
    localStorage.setItem('gcal_token_expiry', String(gcalTokenExpiry));
    history.replaceState(null, '', window.location.pathname);
  }
}

function sbFetch(path, opts={}) {
  return fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', ...(opts.headers||{}) } });
}

function hsProxy(path, body) {
  return fetch(HS_PROXY, { method:'POST', headers:{ Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json', 'x-proxy-target':'hubspot', 'x-hs-path':path }, body: JSON.stringify(body) }).then(r => r.ok ? r.json() : Promise.reject(`HTTP ${r.status}`));
}

async function loadPrspContacts(sourceType='all', force=false) {
  if (!force && prspContactsLoaded && prspContactsLoadedType === sourceType) {
    renderPrspContactsTable(prspContactsData); return;
  }
  const loading = document.getElementById('prsp-loading');
  const error = document.getElementById('prsp-error');
  const tableWrap = document.getElementById('prsp-table-wrap');
  loading.style.display = 'flex'; error.style.display = 'none'; tableWrap.style.display = 'none';
  const btn = document.getElementById('refresh-btn'); if (btn) btn.classList.add('spinning');
  try {
    let rows;
    if (sourceType === 'Dripify') {
      const r = await sbFetch('prospects?select=*&order=created_at.desc');
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const raw = await r.json();
      rows = raw.map(p => ({ ...p, full_name: [p.first_name,p.last_name].filter(Boolean).join(' ')||'—', source_type:'Dripify', source_name: p.campaign||'Dripify' }));
    } else {
      const filter = sourceType !== 'all' ? `&source_type=eq.${encodeURIComponent(sourceType)}` : '';
      const r = await sbFetch(`contacts?select=*&order=created_at.desc${filter}`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      rows = await r.json();
    }
    prspContactsData = rows; prspContactsLoadedType = sourceType; prspContactsLoaded = true;
    renderPrspContactsTable(rows);
  } catch(e) {
    loading.style.display = 'none'; error.style.display = 'block';
    error.innerHTML = `<strong>Couldn't load contacts.</strong> ${e.message}`;
  }
  if (btn) btn.classList.remove('spinning');
}

async function loadMadMeets() {
  try {
    const ids = MAD_MEETS_CONTACTS.map(c => c.id);
    const res = await hsProxy('/crm/v3/objects/contacts/batch/read', { inputs: ids.map(id => ({id})), properties: ['hs_lead_status','notes_last_contacted'] });
    if (res.results) {
      res.results.forEach(r => {
        const c = MAD_MEETS_CONTACTS.find(x => x.id === r.id);
        if (c) { c._hsStatus = r.properties?.hs_lead_status || 'null'; c._hsLastContacted = r.properties?.notes_last_contacted || null; }
      });
    }
  } catch(e) { console.warn('MAD Meets HS fetch failed:', e); }
}

function renderLastCommsCell(cell, data, contact) {
  if (!cell) return;
  if (!data) { cell.innerHTML = '<span class="mm-lc-none">No emails logged</span>'; return; }
  const dirLabel = data.direction === 'received' ? '↓ They replied' : '↑ You sent';
  const dirCls = data.direction === 'received' ? 'mm-lc-received' : 'mm-lc-sent';
  cell.innerHTML = `
    <span class="mm-lastcomms-direction ${dirCls}">${dirLabel}</span>
    ${data.subject ? `<div class="mm-lc-subject">${data.subject.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : ''}
    ${data.snippet ? `<div class="mm-lc-snippet">${data.snippet.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : ''}
    <div class="mm-lc-date">${data.dateStr}</div>
    <a class="mm-lc-hs-link" href="${data.hsLink}" target="_blank">View in HubSpot ↗</a>`;
}

async function loadAllLastComms() {
  try {
    const assocRes = await hsProxy('/crm/v4/associations/contact/email/batch/read', { inputs: MAD_MEETS_CONTACTS.map(c => ({id:c.id})) });
    const contactEmailMap = {};
    for (const r of (assocRes.results||[])) {
      const cid = String(r.from?.id);
      const ids = (r.to||[]).map(t => String(t.toObjectId)).sort((a,b) => Number(b)-Number(a));
      contactEmailMap[cid] = ids;
    }
    for (const c of MAD_MEETS_CONTACTS) {
      if (!contactEmailMap[c.id]) { c._lastComms = null; renderLastCommsCell(document.getElementById(`lc-${c.id}`), null, c); }
    }
    const emailsToFetch = Object.entries(contactEmailMap).map(([cid,ids]) => ({contactId:cid,emailId:ids[0]}));
    if (!emailsToFetch.length) return;
    const batchRes = await hsProxy('/crm/v3/objects/emails/batch/read', { inputs: emailsToFetch.map(e=>({id:e.emailId})), properties:['hs_email_subject','hs_email_direction','hs_email_text','hs_timestamp'] });
    const emailDataMap = {};
    for (const r of (batchRes.results||[])) emailDataMap[String(r.id)] = r.properties;
    for (const {contactId, emailId} of emailsToFetch) {
      const contact = MAD_MEETS_CONTACTS.find(c => c.id === contactId);
      if (!contact) continue;
      const p = emailDataMap[emailId];
      if (!p) { contact._lastComms = null; }
      else {
        const direction = p.hs_email_direction === 'INCOMING_EMAIL' ? 'received' : 'sent';
        const ts = p.hs_timestamp ? new Date(p.hs_timestamp).getTime() : 0;
        const dateStr = new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
        const bodyClean = (p.hs_email_text||'').split(/\r?\n\r?\n/)[0].replace(/\s+/g,' ').trim().slice(0,140);
        contact._lastComms = { direction, dateStr, subject:p.hs_email_subject||null, snippet:bodyClean, hsLink:`https://app-eu1.hubspot.com/contacts/145756322/record/0-1/${contactId}` };
      }
      renderLastCommsCell(document.getElementById(`lc-${contactId}`), contact._lastComms, contact);
    }
  } catch(e) {
    console.error('loadAllLastComms failed:', e);
    document.querySelectorAll('[id^="lc-"]').forEach(cell => {
      if (cell.innerHTML.includes('Loading')) cell.innerHTML = '<span class="mm-lc-none">Couldn\'t load</span>';
    });
  }
}

  _emailContact = null;
}

function applyEmailTemplate(type, btn) {
  if (!_emailContact) return;
  const templates = getEmailTemplates(_emailContact.name, _emailContact.company || 'your brand');
  const t = templates[type]; if (!t) return;
  document.getElementById('ecm-subject').value = t.subject;
  document.getElementById('ecm-body').value = t.body;
  document.querySelectorAll('.ecm-template-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('ecm-body').focus();
}

function copyEmailToClipboard() {
  const subject = document.getElementById('ecm-subject').value;
  const body = document.getElementById('ecm-body').value;
  const to = document.getElementById('ecm-to').value;
  navigator.clipboard.writeText(`To: ${to}\nSubject: ${subject}\n\n${body}`).then(() => {
    const btn = document.getElementById('ecm-copy-btn'), orig = btn.textContent;
    btn.textContent = 'Copied ✓'; setTimeout(() => btn.textContent = orig, 2000);
  });
}

async function sendProspectEmail() {
  const to = document.getElementById('ecm-to').value.trim();
  const subject = document.getElementById('ecm-subject').value.trim();
  const body = document.getElementById('ecm-body').value.trim();
  const btn = document.getElementById('ecm-send-btn');
  if (!to || !subject || !body) { alert('Please fill in all fields.'); return; }
  if (!gcalIsConnected()) {
    document.getElementById('ecm-no-token-msg').style.display = 'block';
    btn.style.display = 'none'; return;
  }
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    const encodedSubject = '=?UTF-8?B?' + btoa(unescape(encodeURIComponent(subject))) + '?=';
    const htmlBody = body.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    const HS_BCC = '145756322@bcc.eu1.hubspot.com';
    const rawMessage = [`To: ${to}`,`Bcc: ${HS_BCC}`,`Subject: ${encodedSubject}`,'MIME-Version: 1.0','Content-Type: text/html; charset=utf-8','',htmlBody].join('\r\n');
    const encoded = btoa(unescape(encodeURIComponent(rawMessage))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    const res = await fetch('https://www.googleapis.com/gmail/v1/users/me/messages/send', { method:'POST', headers:{'Authorization':`Bearer ${gcalAccessToken}`,'Content-Type':'application/json'}, body:JSON.stringify({raw:encoded}) });
    if (!res.ok) { const err = await res.json(); throw new Error(err?.error?.message || `Gmail API ${res.status}`); }
    alert(`Email sent to ${to} ✓`);
    closeEmailModal();
  } catch(e) { alert(`Error sending: ${e.message}`); }
  btn.disabled = false; btn.textContent = 'Send via Gmail →';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeEmailModal(); });
</script>
